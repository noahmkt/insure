services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: insure
      POSTGRES_USER: insure
      POSTGRES_PASSWORD: insure-local-only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
